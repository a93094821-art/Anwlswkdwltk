<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>농지은행 사업 안내 | 무진장지사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --g1: #1a5c36;
  --g2: #2e7d52;
  --g3: #4caf78;
  --pale: #eaf5ef;
  --bg: #f3f8f5;
  --gold: #c8972a;
  --gold-pale: #fff8e6;
  --text: #162b1f;
  --muted: #5a7a65;
  --border: #cde0d5;
  --white: #fff;
  --shadow: 0 4px 20px rgba(26,92,54,0.10);
  --r: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
.header {
  background: linear-gradient(140deg, var(--g1) 0%, #0c3820 100%);
  padding: 28px 20px 32px;
  color: white;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -20px; left: 0; right: 0;
  height: 40px;
  background: var(--bg);
  border-radius: 40px 40px 0 0;
}
.header .logo-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 18px;
}
.logo-badge {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.header h1 {
  font-family: 'Noto Serif KR', serif;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 8px;
}
.header p { font-size: 13px; opacity: 0.75; line-height: 1.7; }

/* PROGRESS BAR */
.progress-wrap {
  padding: 24px 20px 8px;
  display: flex;
  align-items: center;
  gap: 0;
}
.prog-step {
  display: flex;
  align-items: center;
  gap: 0;
  flex: 1;
}
.prog-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--border);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s;
  position: relative;
  z-index: 1;
}
.prog-dot.active { background: var(--g1); color: white; box-shadow: 0 0 0 4px rgba(26,92,54,0.15); }
.prog-dot.done { background: var(--g3); color: white; }
.prog-line {
  flex: 1;
  height: 3px;
  background: var(--border);
  margin: 0 4px;
  transition: background 0.3s;
}
.prog-line.done { background: var(--g3); }

/* QUESTION CARD */
.q-wrap { padding: 8px 16px 24px; }

.q-card {
  background: var(--white);
  border-radius: var(--r);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  animation: slideIn 0.35s cubic-bezier(0.34,1.2,0.64,1);
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.q-header {
  background: linear-gradient(135deg, var(--g1), #0c3820);
  padding: 18px 20px;
  color: white;
}
.q-step-label {
  font-size: 11px;
  opacity: 0.65;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.q-title { font-size: 18px; font-weight: 700; line-height: 1.4; }
.q-sub { font-size: 13px; opacity: 0.75; margin-top: 4px; }

.q-options { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

.opt-btn {
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  background: var(--white);
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  position: relative;
  overflow: hidden;
}
.opt-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--pale);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.2s;
}
.opt-btn:active::before { transform: scaleX(1); }
.opt-btn:active { border-color: var(--g2); }

.opt-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--pale);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  position: relative; z-index: 1;
}
.opt-content { flex: 1; position: relative; z-index: 1; }
.opt-title { font-size: 15px; font-weight: 700; color: var(--text); }
.opt-desc { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.opt-arrow { font-size: 18px; color: var(--muted); position: relative; z-index: 1; }

/* BACK BTN */
.back-row {
  padding: 0 16px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.back-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  padding: 6px 0;
}

/* RESULT CARD */
.result-wrap { padding: 8px 16px 40px; }

.result-hero {
  background: linear-gradient(140deg, var(--g1), #0c3820);
  border-radius: var(--r);
  padding: 24px 20px;
  color: white;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  animation: popIn 0.4s cubic-bezier(0.34,1.4,0.64,1);
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}
.result-hero::before {
  content: '🌾';
  position: absolute;
  right: 12px; top: 12px;
  font-size: 60px;
  opacity: 0.12;
}
.result-label { font-size: 11px; opacity: 0.65; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.result-biz-name { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
.result-desc { font-size: 13px; opacity: 0.82; line-height: 1.7; }

.result-conds {
  background: rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 14px;
  margin-top: 16px;
}
.result-conds h4 { font-size: 12px; opacity: 0.7; margin-bottom: 10px; letter-spacing: 0.5px; }
.cond-item {
  font-size: 13px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  line-height: 1.5;
  opacity: 0.88;
}
.cond-item:last-child { border-bottom: none; }

/* CONTACT CARD */
.contact-card {
  background: var(--white);
  border-radius: var(--r);
  border: 2px solid var(--g3);
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  animation: popIn 0.5s 0.1s cubic-bezier(0.34,1.4,0.64,1) both;
}
.contact-card h3 { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 14px; letter-spacing: 0.5px; text-transform: uppercase; }
.contact-person {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}
.contact-avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--pale);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  border: 2px solid var(--border);
}
.contact-name { font-size: 18px; font-weight: 700; }
.contact-team { font-size: 12px; color: var(--muted); margin-top: 2px; }
.call-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--g1);
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px;
  width: 100%;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 17px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(26,92,54,0.3);
  transition: background 0.2s;
}
.call-btn:active { background: #0c3820; }
.call-num { font-size: 20px; font-weight: 900; letter-spacing: 1px; }

/* NOTICE */
.notice {
  background: var(--gold-pale);
  border: 1.5px solid #e8d090;
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 12px;
  color: #7a5a10;
  line-height: 1.7;
  margin-bottom: 14px;
  animation: popIn 0.5s 0.2s cubic-bezier(0.34,1.4,0.64,1) both;
}

/* RESTART */
.restart-btn {
  width: 100%;
  background: var(--pale);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--g1);
  cursor: pointer;
  transition: all 0.2s;
  animation: popIn 0.5s 0.3s cubic-bezier(0.34,1.4,0.64,1) both;
}
.restart-btn:active { background: var(--border); }

/* HIDDEN */
.hidden { display: none !important; }
</style>
</head>

let history = [];
let currentQ = 'q1';

function render(qKey) {
  const q = questions[qKey];
  const stepNum = q.step;

  // Update progress
  for (let i = 1; i <= 4; i++) {
    const dot = document.getElementById('pd' + i);
    if (!dot) continue;
    if (i < stepNum) { dot.className = 'prog-dot done'; dot.textContent = '✓'; }
    else if (i === stepNum) { dot.className = 'prog-dot active'; dot.textContent = i; }
    else { dot.className = 'prog-dot'; dot.textContent = i; }
    const line = document.getElementById('pl' + i);
    if (line) line.className = i < stepNum ? 'prog-line done' : 'prog-line';
  }

  // Back button
  document.getElementById('back-row').style.display = history.length > 0 ? 'flex' : 'none';

  // Render question
  document.getElementById('result-wrap').classList.add('hidden');
  document.getElementById('q-wrap').classList.remove('hidden');

  document.getElementById('q-wrap').innerHTML = `
    <div class="q-card">
      <div class="q-header">
        <div class="q-step-label">STEP ${stepNum}</div>
        <div class="q-title">${q.title}</div>
        ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
      </div>
      <div class="q-options">
        ${q.options.map((opt, i) => `
          <button class="opt-btn" onclick="choose('${qKey}', ${i})">
            <div class="opt-icon">${opt.icon}</div>
            <div class="opt-content">
              <div class="opt-title">${opt.title}</div>
              ${opt.desc ? `<div class="opt-desc">${opt.desc}</div>` : ''}
            </div>
            <div class="opt-arrow">›</div>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function choose(qKey, optIdx) {
  const q = questions[qKey];
  const opt = q.options[optIdx];
  history.push(qKey);

  if (opt.next === 'result') {
    showResult(opt.biz);
  } else {
    currentQ = opt.next;
    render(opt.next);
  }
}

function goBack() {
  if (history.length === 0) return;
  const prev = history.pop();
  currentQ = prev;

  // Reset progress dots
  document.getElementById('result-wrap').classList.add('hidden');
  document.getElementById('q-wrap').classList.remove('hidden');
  render(prev);
}

function showResult(bizId) {
  document.getElementById('q-wrap').classList.add('hidden');
  document.getElementById('back-row').style.display = 'flex';
  document.getElementById('result-wrap').classList.remove('hidden');

  // All progress done
  for (let i = 1; i <= 4; i++) {
    const dot = document.getElementById('pd' + i);
    if (dot) { dot.className = 'prog-dot done'; dot.textContent = '✓'; }
    const line = document.getElementById('pl' + i);

function restart() {
  history = [];
  currentQ = 'q1';
  document.getElementById('result-wrap').classList.add('hidden');
  document.getElementById('q-wrap').classList.remove('hidden');
  document.getElementById('back-row').style.display = 'none';
  render('q1');
}

</script>
